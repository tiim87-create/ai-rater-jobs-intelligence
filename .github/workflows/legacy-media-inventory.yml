name: Legacy media inventory

on:
  workflow_dispatch:
  push:
    paths:
      - 'editorial/pages/**'
      - 'scripts/migrate_legacy_media.py'
      - '.github/workflows/legacy-media-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: wordpress-editorial
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find referenced legacy media (read-only)
        run: python scripts/migrate_legacy_media.py > legacy-media-inventory.json
      - name: Display summary
        run: |
          python - <<'PY'
          import json
          with open('legacy-media-inventory.json') as f:
              data=json.load(f)
          print(f"Legacy media URLs: {data['found']}")
          print(f"Previously mapped: {data['already_mapped']}")
          PY
      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        with:
          name: legacy-media-inventory
          path: legacy-media-inventory.json
          retention-days: 30

  migrate:
    if: github.event_name == 'workflow_dispatch'
    needs: inventory
    runs-on: ubuntu-latest
    environment: wordpress-editorial
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing WordPress credentials without publishing
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os, urllib.request
          token=base64.b64encode((os.environ["WP_USER"]+":"+os.environ["WP_APP_PASSWORD"]).encode()).decode()
          req=urllib.request.Request("https://timallen87-zwkba.wpcomstaging.com/wp-json/wp/v2/users/me",headers={"Authorization":"Basic "+token})
          with urllib.request.urlopen(req,timeout=30) as response:
              print("Authenticated WordPress account:", response.status)
          PY
      - name: Retrieve original screenshots for private review
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse
          urls=[
            "https://leapforceexamhelp.wordpress.com/wp-content/uploads/2026/10/img_8283-1.png",
            "https://leapforceexamhelp.wordpress.com/wp-content/uploads/2026/10/user-1ha0j6qdykh7eeydasgppxf4a8db858b7bc04ab6b92a5f8eefbf87ecmntdatascreenshot-2569-10-06-at-21.25.04.png"
          ]
          output=pathlib.Path("legacy-originals"); output.mkdir(exist_ok=True)
          report=[]
          for idx,url in enumerate(urls,1):
              variants=[url,"https://i0.wp.com/"+url.removeprefix("https://")+"?ssl=1",url.replace("leapforceexamhelp.wordpress.com","passleapforceexam.com"),"https://i0.wp.com/passleapforceexam.com/"+url.split("/wp-content/",1)[1].join("") if False else "https://i0.wp.com/passleapforceexam.com/wp-content/"+url.split("/wp-content/",1)[1]+"?ssl=1"]
              item={"index":idx,"source":url,"success":False}
              for variant in variants:
                  try:
                      req=urllib.request.Request(variant,headers={"User-Agent":"Mozilla/5.0 AI-Rater-Insider-Media-Migration"})
                      with urllib.request.urlopen(req,timeout=35) as response:
                          data=response.read(25000001)
                          mime=response.headers.get("Content-Type","")
                      if len(data)>25000000: raise ValueError("Image exceeds 25 MB")
                      if not data.startswith((b"\\x89PNG\\r\\n\\x1a\\n",b"\\xff\\xd8\\xff",b"RIFF")): raise ValueError("Not a recognized image")
                      filename=f"legacy-{idx}.png" if data.startswith(b"\\x89PNG") else f"legacy-{idx}.jpg"
                      (output/filename).write_bytes(data)
                      item.update(success=True,filename=filename,bytes=len(data),content_type=mime,download_url=variant)
                      break
                  except Exception as exc:
                      item.setdefault("errors",[]).append(str(exc)[:250])
              report.append(item)
          (output/"download-report.json").write_text(json.dumps(report,indent=2))
          if not any(x["success"] for x in report): print("No original files could be downloaded; no publishing performed.")
          print(json.dumps([{k:v for k,v in item.items() if k not in ("source","download_url")} for item in report],indent=2))
          PY
      - name: Save originals as restricted-retention artifact (not published)
        uses: actions/upload-artifact@v4
        with:
          name: legacy-originals-private-review
          path: legacy-originals/
          retention-days: 1
          if-no-files-found: error
      - name: Preview transfer and require screenshot review
        run: |
          python scripts/migrate_legacy_media.py
          echo "Transfer is intentionally disabled until sensitive screenshots have been reviewed and cropped."
