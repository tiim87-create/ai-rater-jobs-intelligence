name: Multi-vendor daily quality audit (read-only)
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multi-vendor-quality-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate live multi-vendor snapshot and collect TELUS
        run: |
          python scripts/collect_telus.py --output data/telus_jobs_test.json
          python scripts/preview_telus_matrix.py --existing data/jobs.json --telus data/telus_jobs_test.json --output data/jobs_telus_preview.json
      - name: Upload quality-audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: multi-vendor-audit
          path: |
            data/telus_jobs_test.json
            data/jobs_telus_preview.json
          retention-days: 14
