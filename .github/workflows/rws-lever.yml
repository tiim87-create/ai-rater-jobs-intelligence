name: RWS Lever collection
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rws-jobs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate
        run: python -m scripts.collect_rws
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rws-quality-report
          path: data/quality-report.json
      - name: Publish validated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update validated RWS Lever jobs"
            git push
          fi
