name: TELUS isolated full collector test
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect and validate TELUS jobs
        run: python scripts/collect_telus.py --output data/telus_jobs_test.json
      - uses: actions/upload-artifact@v4
        with:
          name: telus-jobs-test
          path: data/telus_jobs_test.json
          retention-days: 7
