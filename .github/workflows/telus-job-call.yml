name: TELUS job request call-site inspection
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect listJobPosts call sites
        run: python scripts/inspect_telus_job_call.py
