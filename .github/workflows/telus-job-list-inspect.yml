name: TELUS job list API implementation inspection
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public TELUS job list implementation
        run: python scripts/inspect_telus_job_list.py
