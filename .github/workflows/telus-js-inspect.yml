name: TELUS AI JS source diagnostics
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public TELUS AI JavaScript assets
        run: python scripts/inspect_telus_js.py
