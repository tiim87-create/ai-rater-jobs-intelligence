name: TELUS AI Community collector test
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Test TELUS collection
        run: python scripts/collect_telus_test.py
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telus-test-diagnostics
          path: data/telus_test.json
          if-no-files-found: ignore
