name: Weekly market validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          python scripts/backfill_market_snapshots.py
          python scripts/build_weekly_market.py
          python - <<'PY'
          import json
          d=json.load(open('data/market_weekly.json'))
          w=next(w for w in d['weeks'] if w['week']=='2026-W48')
          assert w['complete'],w['missing_sources']
          assert {v:r['count'] for v,r in w['vendors'].items()}=={'RWS':142,'Welo Data':477,'Meridial':827,'TELUS Digital':79}
          assert all(len(set(r['listing_ids']))==r['count'] for r in w['vendors'].values())
          print('WEEKLY BASELINE PASS',w['week'],w['observed_total'])
          print('HISTORICAL WEEKS',len(d['weeks']))
          for week in d['weeks']:
              assert sum(week['market_segments'].values())==week['observed_total']
              assert all(sum(r['market_segments'].values())==r['count'] for r in week['vendors'].values() if r)
              print('SEGMENT GEO AUDIT',week['week'],json.dumps(week['market_segments']),json.dumps(week['geography']))
          for week in d['weeks']:
              print('WEEK AUDIT',json.dumps({'week':week['week'],'complete':week['complete'],'missing':week['missing_sources'],'vendors':{v:({k:r.get(k) for k in ('count','coverage','observed_at','change','project_families')} if r else None) for v,r in week['vendors'].items()}}))
          PY
      - name: Audit unclassified titles
        run: |
          git show origin/main:data/jobs.json > /tmp/market-jobs.json
          PYTHONPATH=scripts python - <<'PY'
          import json
          from collections import Counter
          from classify_market_projects import classify
          jobs=json.load(open('/tmp/market-jobs.json'))['jobs']
          for vendor in sorted({j['vendor'] for j in jobs}):
              rows=[j for j in jobs if j['vendor']==vendor and j['status']=='active']
              unknown=Counter(j['title'] for j in rows if classify(j)=='Other / Unclassified')
              print('UNKNOWN TITLE AUDIT',vendor,json.dumps(unknown.most_common(40),ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-market-validation
          path: data/market_weekly.json
