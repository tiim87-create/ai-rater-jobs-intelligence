name: Editorial WordPress Block Sync
on:
  push:
    branches: [main]
    paths:
      - "editorial/blocks/ios-tables-style.html"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wordpress-editorial-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: wordpress-editorial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish iOS table styles to article 81
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_PAGE_ID: "81"
          BLOCK_SLUG: "ios-tables-style"
          DRY_RUN: "false"
        run: python scripts/wp_editorial_sync.py
      - name: Save original and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-editorial-backup-preview
          path: |
            wp-page-backup.html
            wp-page-preview.html
          if-no-files-found: ignore
          retention-days: 14
