name: Editorial WordPress Block Sync
on:
  workflow_dispatch:
    inputs:
      page_id:
        description: "Existing WordPress page ID"
        required: true
        default: "81"
      block_slug:
        description: "Managed block file name (without .html)"
        required: true
        default: "vendor-antifraud-comparison"
      dry_run:
        description: "Preview only (true); set false only after reviewing preview"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: wordpress-editorial-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: wordpress-editorial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update managed WordPress block
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_PAGE_ID: ${{ inputs.page_id }}
          BLOCK_SLUG: ${{ inputs.block_slug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/wp_editorial_sync.py
      - name: Save original and preview for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-editorial-backup-preview
          path: |
            wp-page-backup.html
            wp-page-preview.html
          if-no-files-found: ignore
          retention-days: 14
